name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race ./...
      - run: node scripts/build-npm.mjs --current
      - run: node npm/bin/agy-auth.js version
      - run: npm pack --dry-run --ignore-scripts
