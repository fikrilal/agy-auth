name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check tag matches package version
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.GITHUB_REF_NAME.replace(/^v/,""); if (p.version !== t) { console.error(`package.json version ${p.version} does not match tag ${t}`); process.exit(1); }'
      - name: Canonical harness verification
        run: go run ./cmd/harness verify --profile ci
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const version = require("./package.json").version;
          const log = fs.readFileSync("CHANGELOG.md", "utf8");
          const header = `## [${version}]`;
          const start = log.indexOf(header);
          if (start < 0) {
            console.error(`CHANGELOG.md has no section for ${version}`);
            process.exit(1);
          }
          const next = log.indexOf("\n## [", start + header.length);
          const section = (next < 0 ? log.slice(start) : log.slice(start, next)).trim();
          const previous = next < 0 ? "" : (log.slice(next).match(/^## \[(\d+\.\d+\.\d+)\]/m) || [])[1];
          const compare = previous
            ? `\n\n**Full Changelog**: https://github.com/fikrilal/agy-auth/compare/v${previous}...v${version}\n`
            : "\n";
          fs.writeFileSync("release-notes.md", section + compare);
          EOF
          gh release create "$GITHUB_REF_NAME" npm/vendor/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
