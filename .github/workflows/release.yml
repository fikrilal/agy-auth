name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check tag matches package version
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.GITHUB_REF_NAME.replace(/^v/,""); if (p.version !== t) { console.error(`package.json version ${p.version} does not match tag ${t}`); process.exit(1); }'
      - name: Canonical harness verification
        run: go run ./cmd/harness verify --profile ci
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" npm/vendor/* --title "$GITHUB_REF_NAME" --generate-notes
